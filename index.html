
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FTC AutoScout</title>

<meta name="description" content="FTC AutoScout: match predictions, scouting notes and alliance selection for FIRST Tech Challenge. Runs in your browser.">
<meta name="theme-color" content="#5d081f">
<meta name="color-scheme" content="light dark">
<!-- Apply the saved theme before the page is drawn, so dark mode doesn't flash white. -->
<script>
  (function () {
    var t = "light";
    try { t = localStorage.getItem("autoscout.theme") || "light"; } catch (e) {}
    if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoScout">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- The engine (Pyodide) comes from jsDelivr: open that connection right away. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Fonts load without blocking the first paint (system font until IBM Plex Sans arrives). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"></noscript>

<link rel="stylesheet" href="app.css">


</head>

<body>

<header class="topbar">

  <button
    class="iconbtn menu-btn"
    id="menuBtn"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path
        d="M3 6h18M3 12h18M3 18h18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <a class="brand" href="#/overview" aria-label="FTC AutoScout home">

    <img
      src="assets/logo-56.png"
      alt=""
      width="34"
      height="34"
    >

    <span class="wordmark">
      <span class="ftc">FTC</span>
      <span class="autoscout">AutoScout</span>
    </span>

  </a>

  <div class="eventpill" id="eventPill" hidden></div>

  <div class="topactions">

    <button
      class="btn ghost light account-btn"
      id="accountBtn"
      type="button"
      title="Team account"
      hidden
    >
      <svg class="account-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M4 20c1.5-3.6 4.4-5 8-5s6.5 1.4 8 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="account-dot" aria-hidden="true"></span>
      <span class="account-label hide-sm">Sign in</span>
    </button>

    <button
      class="btn ghost light"
      id="switchBtn"
      title="Quick switch (Ctrl+K)"
    >
      <svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="hide-sm"> Quick switch</span>
    </button>

    <button class="btn light" id="saveBtn">
      Save<span class="hide-sm"> session</span>
    </button>

  </div>

</header>

<nav class="nav" id="nav" aria-label="Pages"></nav>

<div class="scrim" id="scrim" hidden></div>

<main id="main">

  <div class="splash" id="splash">

    <img
      src="assets/logo-56.png"
      alt=""
      width="56"
      height="56"
    >

    <h1>FTC AutoScout</h1>

    <p id="splashText">Starting…</p>

    <div class="bar">
      <div class="bar-fill indeterminate"></div>
    </div>

    <p class="muted small">
      The first visit downloads the AutoScout engine (about 7 MB).
      After that it opens from this device, even offline.
    </p>

  </div>

</main>

<footer class="site-footer" id="siteFooter">
  <span>Ad Majorem Dei Gloriam © 2026 LightSaders Robotics</span>
</footer>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
  hidden
></div>

<script>
  window.AUTOSCOUT_TEAM_STORAGE = {
    url: "https://autoscout-github-team-storage.kovalikg29.workers.dev"
  };
</script>
<script src="github-storage-worker/client.js" defer></script>
<script src="app.js" defer></script>

</body>
</html>
